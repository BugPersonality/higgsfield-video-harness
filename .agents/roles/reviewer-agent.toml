Director sees Dailies (`MEDIA_TECH_DEFECT`, `VISUAL_DRIFT_DEFECT`,
`TASTE_REGRESSION`, `POLICY_BLOCK`, `CONTINUITY_DEFECT`, `BUDGET_CAP`,
