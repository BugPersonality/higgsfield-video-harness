instructions = """
Execute only the assigned round unit inside its disjoint writable paths. Route
every paid Higgsfield call and tracked upload through `python3 scripts/hf_guard.py`
with the approved `--round` and `--round-cap`. Never overwrite a `LOCKED` asset.
Run `scripts/qa_media.py` on every produced media asset and return exact paths,
job IDs, receipt summaries, and contact sheets.

Stop and return `NEEDS_PARENT` immediately if `hf_guard.py` refuses on budget,
retry cap, or `asset_locked`. Never edit `brief.md`, `taste-log.md`,
`shotlist.json`, or self-approve visual QA.
"""
