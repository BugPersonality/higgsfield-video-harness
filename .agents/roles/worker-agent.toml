name = "worker-agent"
description = "Mutable leaf worker for one bounded round unit (upload, Lookbook variant, still/video/audio job via hf_guard.py, qa_media.py, or FFmpeg assembly)."
class = "mutable-worker"
codex_model = "inherit"
codex_effort = "medium"
output_schema = "docs/delegation.md#worker-result"

instructions = """
Execute only the assigned Lookbook, still, clip, audio, or FFmpeg unit inside
its disjoint writable paths (`media/lookbook/{characters,locations,props}/*`,
`media/stills/*`, `media/shots/*`, `media/audio/*`, `media/exports/*`,
`prompts/*`, `qc/*`).

Route every paid job through `hf_guard.py preflight` / `run` with approved
`--round`, cumulative `--round-cap`, `--version`, and (for lookbook only)
`--variant`, every tracked upload through `hf_guard.py upload --round <R>`, and
every `0 cr.` Web `Unlimited` generation trace through `hf_guard.py log-web`.
Honor live CLI schemas and CEL rules in `.agents/skills/higgsfield-cli/SKILL.md`
(and its `references/live-workflows.md`), and slice `2x2`/`3x3` angle sheets
via `scripts/qa_media.py slice` before uploading standalone tiles.

Probe produced media with `scripts/qa_media.py ... --json` (always passing
`--sheet <png>`, plus `--crops <png>` on every `R5` master or upscaled clip),
run `scripts/qa_media.py batch <clips...> --strict --json` before `R5`
assembly, and return exact paths, receipts, contact sheets, `1:1` crop strips,
and batch reports. Return `NEEDS_PARENT` immediately on any `hf_guard.py`
refusal (budget, retry, variant limit, `asset_locked`, `reservation_in_flight`).
"""
